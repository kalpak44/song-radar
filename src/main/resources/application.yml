spring:
  application:
    name: song-radar

  # Every value comes from the environment with a local-development default, so the same
  # jar runs against a container on a laptop and a managed database with nothing but env
  # vars changed. SONGRADAR_DB_PASSWORD has no default on purpose — a fallback password
  # is one that reaches production unnoticed.
  datasource:
    url: jdbc:postgresql://${SONGRADAR_DB_HOST:localhost}:${SONGRADAR_DB_PORT:5432}/${SONGRADAR_DB_NAME:songradar}
    username: ${SONGRADAR_DB_USERNAME:songradar}
    password: ${SONGRADAR_DB_PASSWORD}
    hikari:
      pool-name: songradar-pool

  thymeleaf:
    cache: ${SONGRADAR_TEMPLATE_CACHE:true}

  servlet:
    multipart:
      # An M3U playlist is text. A cap this low keeps a mistaken upload from filling the
      # volume, and the handler turns the rejection into a message on the page.
      max-file-size: 16MB
      max-request-size: 16MB

  # Spring Data JDBC never creates tables, so Flyway owns the schema outright.
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SONGRADAR_PORT:8080}

songradar:
  storage:
    # Root of the mounted SongRadar volume. Playlist uploads and the future music
    # library share it, so the storage page reports the same filesystem they use.
    path: ${SONGRADAR_STORAGE_PATH:./data}
    # Set for storage backends such as NFS subdirectory provisioners whose reported
    # filesystem size is the whole server rather than the application's PVC request.
    # Zero keeps automatic filesystem-capacity detection for local development.
    capacity-gb: ${SONGRADAR_STORAGE_CAPACITY_GB:0}
    playlists: ${songradar.storage.path}/playlists
    recordings: ${songradar.storage.path}/recordings
  listeners:
    scheduler-threads: ${SONGRADAR_LISTENER_THREADS:2}
