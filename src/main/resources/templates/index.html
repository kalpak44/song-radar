<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SongRadar</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
<main class="flex min-h-screen items-center justify-center px-6 py-16">
    <div class="w-full max-w-xl text-center">

        <span class="inline-flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/60 px-3 py-1 text-xs font-medium tracking-wide text-slate-400 uppercase">
            <span class="size-1.5 rounded-full bg-emerald-400"></span>
            Self-hosted
        </span>

        <h1 class="mt-6 text-4xl font-semibold tracking-tight text-balance sm:text-5xl">
            Hello
            <span class="bg-gradient-to-r from-emerald-400 to-sky-400 bg-clip-text text-transparent">SongRadar</span>
        </h1>

        <p class="mt-4 text-base text-pretty text-slate-400 sm:text-lg">
            Music discovery from IPTV and radio streams. Identify songs as they play,
            find available audio, and build your own library.
        </p>

        <dl class="mt-10 grid grid-cols-1 gap-3 text-left sm:grid-cols-3">
            <div class="rounded-xl border border-slate-800 bg-slate-900/40 p-4">
                <dt class="text-sm font-medium text-slate-200">Listen</dt>
                <dd class="mt-1 text-sm text-slate-400">Tune in to IPTV and radio streams.</dd>
            </div>
            <div class="rounded-xl border border-slate-800 bg-slate-900/40 p-4">
                <dt class="text-sm font-medium text-slate-200">Identify</dt>
                <dd class="mt-1 text-sm text-slate-400">Recognise each track as it plays.</dd>
            </div>
            <div class="rounded-xl border border-slate-800 bg-slate-900/40 p-4">
                <dt class="text-sm font-medium text-slate-200">Collect</dt>
                <dd class="mt-1 text-sm text-slate-400">Keep what you find in one library.</dd>
            </div>
        </dl>

    </div>
</main>
</body>
</html>
